name: Bootstrap npm lockfiles

on:
  push:
    branches: [fix/persistent-auth-rate-limiting]
    paths:
      - ".github/workflows/bootstrap-npm-lockfiles.yml"

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the repository's pinned npm version
        run: npm install --global npm@11.21.2

      - name: Generate root package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify root lock with a clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate browser SDK package lock
        run: npm install --package-lock-only --prefix packages/sdk --ignore-scripts --no-audit --no-fund

      - name: Verify browser SDK lock with a clean install
        run: npm ci --prefix packages/sdk --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles and remove bootstrap workflow
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-npm-lockfiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/sdk/package-lock.json .github/workflows/bootstrap-npm-lockfiles.yml
          git commit -m "build: add reproducible npm lockfiles"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
