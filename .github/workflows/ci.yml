name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: insight-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/insight
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/insight
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
      RUN_DB_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Upgrade npm to a release with the Arborist peer-resolution fix
        run: npm install --global npm@11.21.2
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and PostgreSQL integration tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:e2e
      - name: Install browser SDK dependencies
        run: npm ci --prefix packages/sdk --no-audit --no-fund
      - name: Type check browser SDK
        run: npm run build --prefix packages/sdk
