name: Refresh npm lockfile

on:
  push:
    branches: [fix/persistent-auth-rate-limiting]
    paths:
      - ".github/workflows/bootstrap-lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.21.2

      - name: Regenerate lockfile for the patched Vitest release
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Confirm patched Vitest resolution
        run: node -e "const p=require('./node_modules/vitest/package.json'); if(p.version !== '4.1.12') throw new Error('Expected Vitest 4.1.12, got '+p.version)"

      - name: Commit lockfile and remove bootstrap workflow
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-lockfile-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/bootstrap-lockfile-refresh.yml
          git commit -m "build: lock patched vitest dependency"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
